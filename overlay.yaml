# Keeps the public types a v5 minor may not change, at generation time: the pin
# in spec/ stays the published spec, and oapi-codegen reads it through these
# edits. Applied strictly, so an action that matches nothing fails generation.
#
# Asn is a public alias. Spec 2026.11.15 typed its asn an int64, and 2026.11.20
# made its country and rpki_status required; generated as served, Asn.Asn would
# stop being an int and Asn.Country and Asn.RpkiStatus would stop being
# pointers, so every caller reading them would stop compiling. The decoder
# still refuses an answer without either member (heldRequired, decode.go).
# SatelliteDetail.Asn stays an *int the same way. Spec 2026.11.23 gave the
# first_seen and last_seen of the bot, SSH, SMTP, web, DNS resolver and
# BitTorrent details format: date; they stay strings, each read as a day
# (heldDates, decode.go). Drop this file at v6.
overlay: 1.0.0
info:
  title: Public types held at their v5 shape
  version: 1.0.0
actions:
  - target: $.components.schemas.Asn.required[?(@ == 'country')]
    remove: true
  - target: $.components.schemas.Asn.required[?(@ == 'rpki_status')]
    remove: true
  - target: $.components.schemas.Asn.properties.asn.format
    remove: true
  - target: $.components.schemas.SatelliteDetail.properties.asn.format
    remove: true
  - target: $.components.schemas.BotDetail.properties.first_seen.format
    remove: true
  - target: $.components.schemas.BotDetail.properties.last_seen.format
    remove: true
  - target: $.components.schemas.SshDetail.properties.first_seen.format
    remove: true
  - target: $.components.schemas.SshDetail.properties.last_seen.format
    remove: true
  - target: $.components.schemas.SmtpDetail.properties.first_seen.format
    remove: true
  - target: $.components.schemas.SmtpDetail.properties.last_seen.format
    remove: true
  - target: $.components.schemas.WebDetail.properties.first_seen.format
    remove: true
  - target: $.components.schemas.WebDetail.properties.last_seen.format
    remove: true
  - target: $.components.schemas.DnsResolverDetail.properties.first_seen.format
    remove: true
  - target: $.components.schemas.DnsResolverDetail.properties.last_seen.format
    remove: true
  - target: $.components.schemas.BitTorrentDetail.properties.first_seen.format
    remove: true
  - target: $.components.schemas.BitTorrentDetail.properties.last_seen.format
    remove: true
