name: CI

on:
  push:
    branches: [main]
    # A tag IS the release here: there is no release workflow to gate, and the
    # package is resolvable the moment the tag lands. Running CI on it cannot
    # block a bad release, but it turns one into a red run and an email rather
    # than silence - which is how a package that did not compile sat published
    # for three days.
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ] ; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
